<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon AI 助手</title>
    <style>
        :root {
            --primary-color: #4a6cf7;
            --secondary-color: #6b7af0;
            --background-color: #f5f7fa;
            --chat-bg-color: #ffffff;
            --user-message-bg: #4a6cf7;
            --ai-message-bg: #f0f2f5;
            --text-color: #333333;
            --light-text: #666666;
            --border-color: #e0e0e0;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            background-color: var(--chat-bg-color);
            border-radius: 16px;
            box-shadow: 0 4px 20px var(--shadow-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 10px var(--shadow-color);
        }

        .chat-header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 15px;
            border-radius: 12px;
            position: relative;
            animation: fadeIn 0.3s ease-in-out;
        }

        .user-message {
            background-color: var(--user-message-bg);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background-color: var(--ai-message-bg);
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message-avatar {
            position: absolute;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--primary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
        }

        .user-message .message-avatar {
            right: -46px;
            top: 50%;
            transform: translateY(-50%);
        }

        .ai-message .message-avatar {
            left: -46px;
            top: 50%;
            transform: translateY(-50%);
            background-color: var(--secondary-color);
        }

        .chat-input-container {
            display: flex;
            padding: 20px;
            background-color: var(--chat-bg-color);
            border-top: 1px solid var(--border-color);
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .chat-input:focus {
            border-color: var(--primary-color);
        }

        .send-button {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 2px 5px var(--shadow-color);
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px var(--shadow-color);
        }

        .send-button:active {
            transform: translateY(0);
        }

        .loading-indicator {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 0.8s linear infinite;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .chat-container {
                height: 100vh;
                max-height: none;
                border-radius: 0;
                box-shadow: none;
            }

            .message {
                max-width: 90%;
            }

            .message-avatar {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Dragon AI 助手</h1>
            <p>我是您的智能助手，随时为您提供帮助</p>
        </div>
        <div id="chat-messages" class="chat-messages">
            <!-- 聊天消息将在这里显示 -->
            <div class="ai-message message">
                👋 您好！我是 Dragon AI 助手。请问有什么我可以帮助您的吗？
            </div>
        </div>
        <div class="chat-input-container">
            <input id="chat-input" class="chat-input" type="text" placeholder="输入您的问题..." autofocus>
            <button id="send-button" class="send-button" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script type="module">
        import { AIServerAPI } from "/AI/AIServerAPI.js";

        // DOM 元素
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendButton = document.getElementById('send-button');

        // 消息历史记录
        let messageHistory = [];

        // 检查输入框内容，启用/禁用发送按钮
        chatInput.addEventListener('input', () => {
            sendButton.disabled = chatInput.value.trim() === '';
        });

        // 额外的UI优化功能
        
        // 初始化页面时自动聚焦输入框
        window.addEventListener('DOMContentLoaded', () => {
            chatInput.focus();
        });
        
        // 添加响应式调整功能
        function handleResize() {
            const chatContainer = document.querySelector('.chat-container');
            if (window.innerWidth < 768) {
                chatContainer.style.height = '100vh';
                chatContainer.style.maxHeight = 'none';
                chatContainer.style.borderRadius = '0';
            } else {
                chatContainer.style.height = '100vh';
                chatContainer.style.maxHeight = 'none';
                chatContainer.style.borderRadius = '16px';
            }
        }
        
        // 监听窗口大小变化
        window.addEventListener('resize', handleResize);
        
        // 初始调整
        handleResize();
        
        // 添加键盘快捷键提示（可选）
        function addKeyboardHint() {
            const hint = document.createElement('div');
            hint.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                background-color: rgba(0, 0, 0, 0.7);
                color: white;
                padding: 8px 12px;
                border-radius: 4px;
                font-size: 12px;
                opacity: 0.7;
                transition: opacity 0.3s;
                pointer-events: none;
            `;
            hint.textContent = '按 Enter 发送消息';
            document.body.appendChild(hint);
            
            // 几秒后自动隐藏提示
            setTimeout(() => {
                hint.style.opacity = '0';
                setTimeout(() => {
                    if (document.body.contains(hint)) {
                        document.body.removeChild(hint);
                    }
                }, 300);
            }, 3000);
        }
        
        // 显示键盘提示
        setTimeout(addKeyboardHint, 1000);

        
        // 本地测试响应数据
        const testResponses = {
            '你好': '👋 您好！很高兴见到您！我是 Dragon AI 助手，有什么我可以帮助您的吗？',
            '你能做什么': '我可以回答问题、提供信息、协助完成各种任务，还能进行简单的对话交流。您有什么具体需求吗？',
            '谢谢': '不客气！如果您还有其他问题，随时告诉我。',
            '再见': '👋 再见！祝您有愉快的一天！'
        };

        // 生成随机延迟响应（用于测试）
        function generateRandomResponse(message) {
            // 如果有预定义的响应，使用它
            if (testResponses[message]) {
                return testResponses[message];
            }
            // 否则生成通用响应
            const genericResponses = [
                `谢谢您的提问："${message}"。\n我正在学习如何更好地回答这个问题。`,
                `关于"${message}"，我需要更多信息才能提供准确的回答。`,
                `这是个有趣的话题！"${message}"涉及多个方面，您想了解哪方面的内容？`
            ];
            return genericResponses[Math.floor(Math.random() * genericResponses.length)];
        }

        // 发送消息
        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            // 清空输入框并禁用发送按钮和输入框
            chatInput.value = '';
            sendButton.disabled = true;
            chatInput.disabled = true;

            // 添加用户消息到历史记录和界面
            messageHistory.push({ role: 'user', content: message });
            addUserMessage(message);

            // 添加加载中的AI消息
            let loadingMessage = addAIMessage('', true);
            let aiResponseMessage = null;

            try {
                
                // 调用AI API获取响应
                let fullResponse = '';
                const response = await AIServerAPI.send(messageHistory, (chunk) => {
                    // 流式处理响应
                    fullResponse += chunk;
                    
                    // 更新UI显示
                    if (loadingMessage && loadingMessage.id === 'loading-message' && chatMessages.contains(loadingMessage)) {
                        // 移除加载中的消息
                        chatMessages.removeChild(loadingMessage);
                        loadingMessage = null;
                        // 添加实际的AI响应并保存引用
                        aiResponseMessage = addAIMessage(chunk);
                    } else if (aiResponseMessage && chatMessages.contains(aiResponseMessage)) {
                        // 更新已存在的AI消息
                        aiResponseMessage.innerHTML += chunk; // 使用innerHTML以支持HTML格式
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                    } else {
                        // 处理可能的边缘情况
                        const aiMessages = chatMessages.querySelectorAll('.ai-message');
                        if (aiMessages.length > 0) {
                            const lastAIMessage = aiMessages[aiMessages.length - 1];
                            if (!lastAIMessage.id || lastAIMessage.id !== 'loading-message') {
                                lastAIMessage.innerHTML += chunk;
                                chatMessages.scrollTop = chatMessages.scrollHeight;
                            }
                        } else if (!loadingMessage || !chatMessages.contains(loadingMessage)) {
                            // 如果没有任何消息，创建新消息
                            aiResponseMessage = addAIMessage(chunk);
                        }
                    }
                });

                // 确保加载消息被移除
                if (loadingMessage && chatMessages.contains(loadingMessage)) {
                    chatMessages.removeChild(loadingMessage);
                    loadingMessage = null;
                }

                // 使用实际接收到的完整响应
                const finalResponse = response || fullResponse;
                
                // 添加AI响应到历史记录
                messageHistory.push({ role: 'assistant', content: finalResponse });
                
                // 记录对话日志
                console.log('对话历史:', messageHistory);
                
            } catch (error) {
                console.error('Error sending message:', error);
                // 移除加载中的消息
                if (loadingMessage && chatMessages.contains(loadingMessage)) {
                    chatMessages.removeChild(loadingMessage);
                    loadingMessage = null;
                }
                
                // 添加错误消息，根据错误类型提供更具体的提示
                let errorMessage = '抱歉，我无法处理您的请求。';
                if (error.message && error.message.includes('Network')) {
                    errorMessage += ' 网络连接可能有问题，请检查网络设置。';
                } else if (error.message && error.message.includes('timeout')) {
                    errorMessage += ' 请求超时，请稍后再试。';
                } else {
                    errorMessage += ' 请稍后再试。';
                }
                
                addAIMessage(errorMessage);
            } finally {
                // 恢复输入框功能
                chatInput.disabled = false;
                sendButton.disabled = chatInput.value.trim() === '';
                chatInput.focus();
            }
        }

        // 格式化消息内容（简单的文本格式化）
        function formatMessageContent(content) {
            if (!content) return '';
            
            // 替换换行符为HTML换行
            return content.replace(/\n/g, '<br>');
        }

        // 优化添加消息的方法，支持简单的HTML格式
        function addUserMessage(content) {
            const messageElement = document.createElement('div');
            messageElement.className = 'user-message message';
            messageElement.innerHTML = formatMessageContent(content);
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return messageElement;
        }

        function addAIMessage(content, isLoading = false) {
            let messageElement;
            if (isLoading) {
                // 创建加载中的消息元素
                messageElement = document.createElement('div');
                messageElement.className = 'ai-message message';
                messageElement.id = 'loading-message';
                messageElement.innerHTML = '<span class="loading-indicator"></span> 正在思考...';
            } else {
                // 创建常规AI消息元素
                messageElement = document.createElement('div');
                messageElement.className = 'ai-message message';
                messageElement.innerHTML = formatMessageContent(content);
            }
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return messageElement;
        }

        // 点击发送按钮发送消息
        sendButton.addEventListener('click', sendMessage);

        // 按Enter键发送消息，按Shift+Enter换行
        chatInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
