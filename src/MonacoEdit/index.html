<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monaco Editor (CDN 部署)</title>
    <!-- 引入 Monaco Editor 的 CDN 资源 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.js"></script>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        /* 编辑器容器样式 */
        #editor-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="editor-container"></div>

    <script type="module">

        import { WebdavApi } from '/webdav/WebdavApi.js'
        // 配置 Monaco Editor 的路径（指向 CDN）
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
        const searchParams = new URLSearchParams(window.location.search);
        const src = searchParams.get('src');
        if (src == null) {
            alert('src参数不能为空');
        }
        WebdavApi.src = src;
        // 从Webdav服务器获取文件内容


        // 加载并初始化编辑器
        require(['vs/editor/editor.main'], async function () {
            // 创建编辑器实例
            const editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: "初始代码", // 初始代码
                language: 'javascript', // 默认语言（支持多种，如 html、css、python 等）
                theme: 'vs-dark', // 主题（vs、vs-dark、hc-black）
                fontSize: 14, // 字体大小
                minimap: { enabled: true }, // 启用 minimap（小地图）
                scrollBeyondLastLine: false, // 禁止滚动到最后一行之外
                automaticLayout: true // 自动适应容器大小
            });

            editor.onDidChangeModelContent(() => {
                WebdavApi.pushFile(src, editor.getValue());
            });
            editor.onDidBlurEditorText(() => {
                console.log('编辑器失去焦点');
            });
            editor.onDidFocusEditorText(() => {
                console.log('编辑器获得焦点');
            });
            editor.onDidChangeModelLanguage(() => {
                console.log('语言类型发生变化:', editor.getModel().getLanguageId());
            });

            //判断文件后缀并设置语言
            const fileExtension = src.split('.').pop();
            if (fileExtension === 'py') {
                monaco.editor.setModelLanguage(editor.getModel(), 'python');
            } else if (fileExtension === 'html') {
                monaco.editor.setModelLanguage(editor.getModel(), 'html');
            } else if (fileExtension === 'css') {
                monaco.editor.setModelLanguage(editor.getModel(), 'css');
            } else if (fileExtension === 'js') {
                monaco.editor.setModelLanguage(editor.getModel(), 'javascript');
            } 

            const Response = await WebdavApi.fetchFile(src);
            if (Response.ok) {
                try {
                    const text = await Response.text();
                    editor.setValue(text);
                } catch (error) {
                    console.log(error);
                }
            }

            //重载Ctrl+S
            document.addEventListener('keydown', (event) => {
                if (event.ctrlKey && event.key === 's') {
                    event.preventDefault();
                    WebdavApi.pushFile(src, editor.getValue());
                }
            });
            //monaco.editor.setModelLanguage(editor.getModel(), 'python'); 切换语言类型
        });
    </script>

</body>

</html>
