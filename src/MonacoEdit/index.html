<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monaco Editor (CDN 部署)</title>
    <!-- 引入 Monaco Editor 的 CDN 资源 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.js"></script>
    <style>
        body, 
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 工具栏样式 */
        #toolbar-container {
            background-color: #252526;
            color: white;
            padding: 8px 12px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #toolbar-container button {
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        #toolbar-container button:hover {
            background-color: #1177bb;
        }

        #toolbar-container button:active {
            background-color: #0d47a1;
        }

        #toolbar-container button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        /* 编辑器容器样式 */
        #editor-container {
            width: 100%;
            height: calc(100% - 38px); /* 减去工具栏高度 */
            transition: height 0.2s ease;
        }
        
        /* 当调试控制台显示时，编辑器高度需要减去调试控制台的高度 */
        body.debug-open #editor-container {
            height: calc(100% - 38px - var(--debug-height, 300px)); /* 减去工具栏高度和调试控制台实际高度 */
        }

        /* 调试容器样式 */
        #debug-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 300px;
            background-color: #1e1e1e;
            border-top: 1px solid #3e3e42;
            display: none;
            flex-direction: column;
            z-index: 1000;
        }

        #debug-container.show {
            display: flex;
        }

        /* 调试窗口头部 */
        #debug-header {
            background-color: #252526;
            color: white;
            padding: 8px 12px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: grab;
        }

        #debug-header:active {
            cursor: grabbing;
        }

        /* 调试窗口控制按钮 */
        #debug-controls {
            display: flex;
            gap: 8px;
        }

        .debug-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .debug-btn:hover {
            background-color: #3e3e42;
        }

        /* 调试窗口内容 */
        #debug-content {
            flex: 1;
            overflow: auto;
            padding: 12px;
            color: #d4d4d4;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 13px;
        }

        /* 调试输出行样式 */
        .debug-line {
            margin: 4px 0;
            padding: 2px 0;
            border-bottom: 1px solid #2d2d2d;
        }

        .debug-line.error {
            color: #f48771;
        }

        .debug-line.warn {
            color: #cca700;
        }

        .debug-line.info {
            color: #6cb784;
        }

        /* 调试窗口大小调整手柄 */
        #debug-resizer {
            position: absolute;
            top: -4px;
            left: 0;
            width: 100%;
            height: 8px;
            cursor: ns-resize;
            background-color: transparent;
        }
    </style>
</head>

<body>
    <div id="toolbar-container">
        <button id="run-button">运行</button>
    </div>
    <div id="editor-container"></div>
    <div id="debug-container">
        <div id="debug-header">
            <div>调试控制台</div>
            <div id="debug-controls">
                <button class="debug-btn" id="clear-debug">清空</button>
                <button class="debug-btn" id="close-debug">关闭</button>
            </div>
        </div>
        <div id="debug-resizer"></div>
        <div id="debug-content"></div>
        <iframe id="runcode-iframe" style="display: none;"></iframe>
    </div>

    <script type="module">

        import { WebdavApi } from '/webdav/WebdavApi.js'
        
        // 配置 Monaco Editor 的路径（指向 CDN）
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
        const searchParams = new URLSearchParams(window.location.search);
        const src = searchParams.get('src');
        if (src == null) {
            alert('src参数不能为空');
        }
        WebdavApi.src = src;
        // 从Webdav服务器获取文件内容


        // 加载并初始化编辑器
        require(['vs/editor/editor.main'], async function () {
            // 创建编辑器实例
            const editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: "初始代码", // 初始代码
                language: 'javascript', // 默认语言（支持多种，如 html、css、python 等）
                theme: 'vs-dark', // 主题（vs、vs-dark、hc-black）
                fontSize: 14, // 字体大小
                minimap: { enabled: true }, // 启用 minimap（小地图）
                scrollBeyondLastLine: false, // 禁止滚动到最后一行之外
                automaticLayout: true // 自动适应容器大小
            });

            editor.onDidChangeModelContent(() => {
                WebdavApi.pushFile(src, editor.getValue());
            });
            editor.onDidBlurEditorText(() => {
                console.log('编辑器失去焦点');
            });
            editor.onDidFocusEditorText(() => {
                console.log('编辑器获得焦点');
            });
            editor.onDidChangeModelLanguage(() => {
                console.log('语言类型发生变化:', editor.getModel().getLanguageId());
            });

            // 判断文件后缀并设置语言
            const fileExtension = src.split('.').pop();
            let openDebug = false;
            
            if (fileExtension === 'py') {
                monaco.editor.setModelLanguage(editor.getModel(), 'python');
            } else if (fileExtension === 'html') {
                monaco.editor.setModelLanguage(editor.getModel(), 'html');
            } else if (fileExtension === 'css') {
                monaco.editor.setModelLanguage(editor.getModel(), 'css');
            } else if (fileExtension === 'js') {
                monaco.editor.setModelLanguage(editor.getModel(), 'javascript');
                openDebug = true;
            }

            // 设置工具栏
            const toolbarContainer = document.getElementById('toolbar-container');
            if (openDebug) {
                toolbarContainer.style.display = 'flex';
            } else {
                toolbarContainer.style.display = 'none';
            }

            // 初始化调试容器
            const debugContainer = document.getElementById('debug-container');

            // 调试相关功能
            let isDebugOpen = false;
            const debugContent = document.getElementById('debug-content');
            const runButton = document.getElementById('run-button');
            const closeDebugButton = document.getElementById('close-debug');
            const clearDebugButton = document.getElementById('clear-debug');
            const debugResizer = document.getElementById('debug-resizer');
            const debugHeader = document.getElementById('debug-header');
            
            // 初始化CSS变量（初始值设为默认高度300px）
            document.documentElement.style.setProperty('--debug-height', '300px');

            // 添加调试日志
            function addDebugLog(message, type = 'info') {
                const logLine = document.createElement('div');
                logLine.className = `debug-line ${type}`;
                logLine.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
                debugContent.appendChild(logLine);
                debugContent.scrollTop = debugContent.scrollHeight;
            }

            // 清空调试日志
            function clearDebugLog() {
                debugContent.innerHTML = '';
            }

            // 显示调试窗口
            function showDebugWindow() {
                debugContainer.classList.add('show');
                // 显示后重新计算并设置正确的高度
                const actualHeight = debugContainer.offsetHeight;
                document.documentElement.style.setProperty('--debug-height', `${actualHeight}px`);
                document.body.classList.add('debug-open');
                isDebugOpen = true;
                // 调整编辑器布局
                editor.layout();
            }

            // 隐藏调试窗口
            function hideDebugWindow() {
                debugContainer.classList.remove('show');
                document.body.classList.remove('debug-open');
                isDebugOpen = false;
                // 调整编辑器布局
                editor.layout();
            }

            window.addEventListener('message', (event) => {
                if (event.data.type === 'log') {
                    addDebugLog(event.data.message, event.data.level);
                } else if (event.data.type === 'result') {
                    if (event.data.value !== undefined) {
                        addDebugLog(`返回结果: ${event.data.value}`, 'info');
                    }
                } else if (event.data.type === 'done') {
                    addDebugLog('代码运行完成', 'info');
                } else if (event.data.type === 'error') {
                    addDebugLog(`错误: ${event.data.message}`, 'error');
                    addDebugLog(`堆栈信息: ${event.data.stack}`, 'error');
                }
            });

            // 运行代码
            function runCode() {
                if (!openDebug) return;
                
                // 显示调试窗口
                showDebugWindow();
                
                // 清空之前的日志
                clearDebugLog();
                // 获取代码内容
                addDebugLog('开始运行代码...', 'info');
                
                // 创建iframe
                const iframe = document.querySelector('#runcode-iframe');
                // 设置iframe的src并添加到文档
                iframe.src = `runcode.html?code_src=${encodeURIComponent(src)}`;
            }

            

            // 窗口大小调整功能
            let isResizing = false;
            let startY = 0;
            let startHeight = 0;

            debugResizer.addEventListener('mousedown', (e) => {
                isResizing = true;
                startY = e.clientY;
                startHeight = debugContainer.offsetHeight;
                document.body.style.userSelect = 'none';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                
                const deltaY = startY - e.clientY;
                const newHeight = Math.max(100, startHeight + deltaY);
                debugContainer.style.height = `${newHeight}px`;
                
                // 更新CSS变量和编辑器高度
                document.documentElement.style.setProperty('--debug-height', `${newHeight}px`);
                
                // 调整编辑器布局
                editor.layout();
            });

            document.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    document.body.style.userSelect = '';
                }
            });

            // 移除窗口拖拽功能，改为固定在底部
            debugHeader.style.cursor = 'default';

            // 事件监听
            runButton.addEventListener('click', runCode);
            closeDebugButton.addEventListener('click', hideDebugWindow);
            clearDebugButton.addEventListener('click', clearDebugLog);

            // 从Webdav服务器获取文件内容
            const Response = await WebdavApi.fetchFile(src);
            if (Response.ok) {
                try {
                    const text = await Response.text();
                    editor.setValue(text);
                } catch (error) {
                    addDebugLog(`读取文件失败: ${error.message}`, 'error');
                }
            }

            // 重载Ctrl+S
            document.addEventListener('keydown', (event) => {
                if (event.ctrlKey && event.key === 's') {
                    event.preventDefault();
                    WebdavApi.pushFile(src, editor.getValue());
                }
            });
        });
    </script>

</body>

</html>
