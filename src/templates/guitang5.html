<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>侦探推理游戏</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.26.1/axios.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --sepia: #704214;
            --old-paper: #f4e4bc;
            --shadow: #2b1810;
        }

        body {
            background-color: #000;
            color: #d4c4a8;
            font-family: 'Special Elite', cursive;
            margin: 0;
            padding: 0;
            /* height: 100vh; */
            opacity: 0.9999;
            background-image: url('/static/horrible/mask.png');
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('/static/horrible/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.2;
            pointer-events: none;
            z-index: 0;
        }

        #vintage-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0.008;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.7) 100%);
            pointer-events: none;
            z-index: 2;
        }

        #status-bar {
            background: rgba(0,0,0,0.8);
            border-bottom: 1px solid var(--sepia);
            padding: 15px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            font-family: 'Abril Fatface', cursive;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .date-stamp {
            color: var(--old-paper);
            font-size: 1.2em;
            text-align: center;
            opacity: 0.8;
        }

        #chat-container {
            height: calc(100vh - 120px);
            margin-top: 60px;
            padding: 20px;
            overflow-y: auto;
            position: relative;
        }

        .message {
            margin: 20px 0;
            padding: 20px;
            max-width: 80%;
            position: relative;
            background: linear-gradient(rgba(244,228,188,0.1), rgba(244,228,188,0.05));
            border: 1px solid rgba(112,66,20,0.3);
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3);
            z-index: 1;
        }
        .message::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('/static/c.png');
            opacity: 0.1;
            pointer-events: none;
        }

        .user-message {
            margin-left: auto;
            background: linear-gradient(rgba(43,24,16,0.8), rgba(43,24,16,0.6));
            transform: rotate(1deg);
        }

        .ai-message {
            margin-right: auto;
            background: linear-gradient(rgba(43,24,16,0.6), rgba(43,24,16,0.4));
            transform: rotate(-1deg);
        }

        .message-time {
            position: absolute;
            bottom: -20px;
            right: 10px;
            font-size: 0.8em;
            color: var(--sepia);
            font-style: italic;
            opacity: 0.7;
        }

        #input-area {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 15px;
            background: rgba(0,0,0,0.8);
            border-top: 1px solid var(--sepia);
            z-index: 100;
        }

        #message-input {
            background: rgba(244,228,188,0.1);
            color: var(--old-paper);
            border: 1px solid var(--sepia);
            padding: 10px;
            font-family: 'Special Elite', cursive;
        }

        #message-input::placeholder {
            color: rgba(244,228,188,0.5);
        }

        .btn-vintage {
            background: var(--shadow);
            color: var(--old-paper);
            border: 1px solid var(--sepia);
            font-family: 'Abril Fatface', cursive;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn-vintage:hover {
            background: var(--sepia);
            color: var(--old-paper);
            box-shadow: 0 0 10px rgba(112,66,20,0.5);
        }

        .scratch {
            position: fixed;
            background: rgba(255,255,255,0.1);
            pointer-events: none;
        }
        .fade-corner {
            position: fixed;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle at center,
                transparent 70%);
            pointer-events: none;
        }

        /* 自定义滚动条样式 */
        ::-webkit-scrollbar {
            width: 12px; /* 滚动条宽度 */
        }

        /* 滚动条轨道 */
        ::-webkit-scrollbar-track {
            background: rgba(112, 66, 20, 0.1); /* 轨道背景色 */
            border-radius: 10px;
        }

        /* 滚动条滑块 */
        ::-webkit-scrollbar-thumb {
            background: rgba(112, 66, 20, 0.5); /* 滑块背景色 */
            border-radius: 10px;
            border: 2px solid rgba(112, 66, 20, 0.2); /* 滑块边框 */
        }

        /* 滚动条滑块悬停效果 */
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(112, 66, 20, 0.7); /* 悬停时滑块背景色 */
        }
    </style>
    
    <link rel="stylesheet" href="/static/third_party/atom-one-dark.min.css">
    <link rel="stylesheet" href="/static/chat-ai.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
</head>
<body>
    
    <div id="vintage-overlay"></div>

    <div id="status-bar">
        <div class="date-stamp">
            档案编号: #<span id="case-number"></span>
            <span style="margin-left: 20px;">日期: <span id="date-display"></span></span>
            <button onclick="nextCase()" class="btn btn-vintage" style="margin-right: 20px;">下一份档案</button>
            <button onclick="goToHome()" class="btn btn-vintage" style="margin-right: 20px;">
                <i class="fas fa-user"></i>
            </button>
    </div>
                </div>

    <div id="chat-container"></div>

    <div id="input-area">
        <div class="container-fluid">
            <div class="row">
                <div class="col-10">
                    <input type="text" id="message-input" class="form-control"
                           placeholder="总感觉还有不合理的地方...">
                </div>
                <div class="col-2">
                    <button onclick="sendMessage(document.getElementById('message-input'))" class="btn btn-vintage w-100">
                        找寻真相
                    </button>
            </div>
        </div>
    </div>
    </div>
    <script src="/static/chat-ai.js"></script>
    <script>
        const chatAI = new ChatAI();

        function goToHome() {
            window.location.href = '/';
        }

        function createVintageEffects() {
            for(let i = 0; i < 20; i++) {
                const scratch = document.createElement('div');
                scratch.className = 'scratch';
                scratch.style.width = `${Math.random() * 2}px`;
                scratch.style.height = `${Math.random() * 100}px`;
                scratch.style.left = `${Math.random() * 100}%`;
                scratch.style.top = `${Math.random() * 100}%`;
                scratch.style.transform = `rotate(${Math.random() * 360}deg)`;
                document.body.appendChild(scratch);
            }

            const corners = [[0,0], [0,100], [100,0], [100,100]];
            corners.forEach(([x, y]) => {
                const fade = document.createElement('div');
                fade.className = 'fade-corner';
                fade.style.left = `${x}%`;
                fade.style.top = `${y}%`;
                fade.style.transform = 'translate(-50%, -50%)';
                document.body.appendChild(fade);
            });
        }

        function updateDateDisplay() {
            const dateElement = document.getElementById('date-display');
            const date = new Date();
            dateElement.textContent = date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        function generateCaseNumber() {
            const caseElement = document.getElementById('case-number');
            caseElement.textContent = Math.random().toString(36).substr(2, 6).toUpperCase();
        }

        function setTitle(name) {
            const caseElement = document.getElementById('case-number');
            caseElement.textContent = "《" + name + "》";
        }

        async function sendMessage() {
            const chatMessages = document.getElementById('chat-container');
            const input = document.getElementById('message-input');
            const message = input.value.trim();

            if (!message) return;

            try {
                chatMessages.innerHTML += `
                    <div class="message user-message">
                        ${chatAI.formatMessage(message)}
                    </div>
                `;
                chatMessages.scrollTop = chatMessages.scrollHeight;

                input.value = '';

                const aiMessageDiv = document.createElement('div');
                aiMessageDiv.className = 'message ai-message';
                chatMessages.appendChild(aiMessageDiv);

                const onResponse = (content) => {
                    aiMessageDiv.innerHTML = chatAI.formatMessage(content);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                };

                await chatAI.send(message, onResponse);
            } catch (error) {
                console.error('Error:', error);
                showToast('Error sending message: ' + error.message);
            }
        }

        async function nextCase() {
            const chatMessages = document.getElementById('chat-container');
            chatMessages.innerHTML = '';
            
            await chatAI.resetContext();

            const obj = await chatAI.LoadJsonFromServer('/api/haiguitang')
            chatAI.SaveJsonToLocalStorage("story",obj);
            setTitle(obj.name);
            chatAI.systemPrompt = obj.system_prompt;
            const messageDiv = document.createElement('div');
            messageDiv.className =  'message ai-message';
            const message = obj.first_message;
            messageDiv.innerHTML = chatAI.formatMessage(message);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            chatAI.addContext({ role: "assistant", content: message });
        }

        window.onload = () => {
            createVintageEffects();
            updateDateDisplay();
            generateCaseNumber();
            
            const obj = chatAI.LoadJsonFromLocalStorage("story");
         
            if(!obj)
            {
                nextCase();
            }
            else
            {
                setTitle(obj.name);
                chatAI.systemPrompt = obj.system_prompt;
            }

            const chatMessages = document.getElementById('chat-container');
            chatAI.context.forEach(msg => {
                const messageDiv = document.createElement('div');
                messageDiv.className = msg.role === 'user' ? 'message user-message' : 'message ai-message';
                messageDiv.innerHTML = chatAI.formatMessage(msg.content);
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
        
            const sound = new Howl({
                src: ['/static/horrible/TheGrotto.mp3'],
                autoplay: true,
                loop: true,
                volume: 0.5
            });

            document.getElementById('message-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });

            setInterval(updateDateDisplay, 60000);
        };
    </script>
    
</body>
</html>
