<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI Chat - 胡鑫培专属</title>
    <!-- 核心UI库 -->
    <link href="/static/third_party/bootstrap.min.css" rel="stylesheet">
    <link href="/static/third_party/atom-one-dark.min.css" rel="stylesheet">
    <link href="/static/third_party/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
            margin: 0;
        }

        .chat-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            max-width: 100%;
        }

        .chat-header {
            background: #2d2d2d;
            padding: 10px 20px;
            border-bottom: 1px solid #404040;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h4 {
            margin: 0;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .header-buttons button {
            background: none;
            border: none;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 16px;
        }

        .header-buttons button:hover {
            color: #2b5582;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease;
        }

        .user-message {
            justify-content: flex-end;
        }

        .ai-message {
            justify-content: flex-start;
        }

        .message-content {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 10px;
            max-width: 95%;
        }

        .user-message .message-content {
            background: #2b5582;
            margin-left: auto;
        }

        .ai-message .message-content {
            background: #2d2d2d;
            margin-right: auto;
        }

        .message pre {
            background: #1a1a1a !important;
            border-radius: 5px;
            padding: 15px;
            margin: 10px 0;
            position: relative;
        }

        .copy-btn {
            position: absolute;
            right: 10px;
            top: 10px;
            background: #404040;
            border: none;
            border-radius: 4px;
            color: #fff;
            padding: 5px 10px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .message pre:hover .copy-btn {
            opacity: 1;
        }

        .input-area {
            background: #2d2d2d;
            padding: 20px;
            border-top: 1px solid #404040;
        }

        .input-group {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            align-items: center;
        }

        #userInput {
            background: #1a1a1a;
            border: none;
            color: #fff;
            resize: none;
            height: 50px;
            max-height: 200px;
            flex-grow: 1;
            margin-right: 10px;
        }

        #userInput:focus {
            outline: none;
            box-shadow: none;
        }

        .send-btn {
            background: #2b5582;
            border: none;
            border-radius: 5px;
            padding: 8px 20px;
            cursor: pointer;
        }

        .upload-btn {
            background: #4CAF50;
            border: none;
            border-radius: 5px;
            padding: 8px 20px;
            cursor: pointer;
            margin-right: 10px;
        }

        .send-btn:hover {
            background: #366baa;
        }

        .upload-btn:hover {
            background: #45a049;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #404040;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a4a4a;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            margin: 0 10px;
        }

        .user-avatar {
            background-color: #2b5582;
            color: #fff;
            order: 2;
        }

        .ai-avatar {
            background-color: #4CAF50;
            color: #fff;
            order: 0;
        }
    </style>
    <link rel="stylesheet" href="/static/chat-ai.css">
</head>
<body>
    <div class="container-fluid chat-container">
        <div class="chat-header">
            <h4 class="m-0"><i class="fas fa-robot me-2"></i>AI Assistant</h4>
            <div class="header-buttons">
                <button onclick="newChat()"><i class="fas fa-plus"></i></button>
                <button onclick="showAuthorInfo()"><i class="fas fa-user"></i></button>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="input-area">
            <div class="input-group">
                <textarea id="userInput" class="form-control" placeholder="输入消息..."></textarea>
                <label for="fileInput" class="upload-btn">
                    <i class="fas fa-upload"></i>
                    <input type="file" id="fileInput" style="display: none;" onchange="handleFileUpload(event)">
                </label>
                <button class="send-btn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                                    </button>
            </div>
        </div>
    </div>

    <!-- 核心JS库 -->
    <script src="/static/chat-ai.js"></script>
    <script>
        const chatAI = new ChatAI();

        document.addEventListener('DOMContentLoaded', async () => {
            await chatAI.initializePromise;

            if (chatAI.context.length === 0) {
                const firstMessage = await chatAI.getFristMessageByNet();
                if (firstMessage) {
                    chatAI.addContext({ role: "assistant", content: firstMessage });
                }
            }
            const chatMessages = document.getElementById('chatMessages');
            chatAI.context.forEach(msg => {
                addMessage(msg.role, chatAI.formatMessageContent(msg.content));
            });
        });

        async function sendMessage() {
            const userInput = document.getElementById('userInput');
            const message = userInput.value.trim();
            if (!message) return;

            addMessage('user', message);
            userInput.value = '';
            adjustTextareaHeight(userInput);
                const aiMessageId = addMessage('ai', '思考中...');

            try {
                await chatAI.send(message, (response) => {
                    updateMessage(aiMessageId, response);
                });
            } catch (error) {
                console.error('Error:', error);
                updateMessage(aiMessageId, '抱歉，发生错误，请重试。');
        }

            document.querySelector('.input-area').scrollIntoView({ behavior: 'smooth' });
        }

        function addMessage(role, content) {
            const messageId = Date.now();
            const messageDiv = document.createElement('div');
            messageDiv.id = `message-${messageId}`;
            messageDiv.className = `message ${role}-message`;

            const avatar = role === 'user' ? 'H' : 'AI';
            const avatarClass = role === 'user' ? 'user-avatar' : 'ai-avatar';
            messageDiv.innerHTML = `
                <div class="avatar ${avatarClass}">${avatar}</div>
                <div class="message-content">
                    ${chatAI.formatMessage(content)}
                </div>
            `;

            document.getElementById('chatMessages').appendChild(messageDiv);
            messageDiv.scrollIntoView({ behavior: 'smooth' });
            return messageId;
        }

        function updateMessage(messageId, content) {
            const messageDiv = document.getElementById(`message-${messageId}`);
            if (messageDiv) {
                messageDiv.querySelector('.message-content').innerHTML = chatAI.formatMessage(content);
            }
        }

        function adjustTextareaHeight(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 300) + 'px';
        }
        document.getElementById('userInput').addEventListener('input', function() {
            adjustTextareaHeight(this);
        });

        document.getElementById('userInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const content = e.target.result;
                    chatAI.attachment_text(file.name, content);
                    addMessage('user', `上传文件:《${file.name}》`);
                };
                reader.readAsText(file);
            }
        }

        function newChat() {
            document.getElementById('chatMessages').innerHTML = '';
            chatAI.resetContext();
            location.reload();
        }

        function showAuthorInfo() {
            window.location.href = '/';
        }
    </script>
</body>
</html>
