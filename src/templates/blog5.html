<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Microsoft YaHei', sans-serif;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .background-section {
            position: fixed;
            left: 0;
            top: 0;
            width: 70%;
            height: 100vh;
            overflow: hidden;
        }

        .background-image {
            position: absolute;
            width: 180%;
            height: 180%;
            object-fit: cover;
            transform: translateX(-15%) translateY(-1%);
            filter: brightness(0.8);
        }

        .content-section {
            position: fixed;
            right: 0;
            width: 30%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-left: 2px solid #0ff;
        }

        .title {
            color: #0ff;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #0ff;
            /*animation: glow 2s ease-in-out infinite alternate;*/
            position: relative;
            padding: 1rem;
            border: 2px solid #0ff;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .title::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(0, 255, 255, 0.2);
            transition: all 0.5s ease;
        }

        .title:hover::before {
            left: 100%;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 5px #0ff, 0 0 10px #0ff, 0 0 15px #0ff;
            }
            to {
                text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 30px #0ff;
            }
        }

        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .nav-button {
            padding: 1rem 2rem;
            background: transparent;
            border: 2px solid #0ff;
            color: #0ff;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .nav-button:hover {
            background: #0ff;
            color: #000;
            transform: translateX(10px);
        }

        .nav-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(0, 255, 255, 0.2);
            transition: all 0.5s ease;
        }

        .nav-button:hover::before {
            left: 100%;
        }

        .bio {
            color: #fff;
            line-height: 1.6;
            text-shadow: 0 0 10px #0ff;
            position: relative;
            padding: 1rem;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        .glitch-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            mix-blend-mode: overlay;
            animation: glitch 2s infinite;
            pointer-events: none;
        }

        @keyframes glitch {
            0% {
                transform: translate(0);
            }
            20% {
                transform: translate(-5px, 5px);
            }
            40% {
                transform: translate(-5px, -5px);
            }
            60% {
                transform: translate(5px, 5px);
            }
            80% {
                transform: translate(5px, -5px);
            }
            100% {
                transform: translate(0);
            }
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 255, 255, 0.02) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="background-section">
            <img src="/static/IMG_1612.JPG" alt="个人照片" class="background-image">
        </div>

        <div class="content-section">
            <h1 class="title">胡鑫培</h1>
            <div class="nav-buttons">
                <a href="#" class="nav-button">关于我</a>
                <a href="#" class="nav-button">项目展示</a>
                <a href="#" class="nav-button">博客文章</a>
                <a href="#" class="nav-button">联系方式</a>
            </div>

            <div class="bio">
                <div class="glitch-effect"></div>
                全栈开发工程师，专注于人工智能和现代网络技术。
                热衷于探索技术与创意的完美结合。
                致力于打造极致用户体验的数字作品。
            </div>
        </div>
    </div>

    <div class="scanline"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const background = document.querySelector('.background-image');
            const title = document.querySelector('.title');
            let lastScrollY = window.scrollY;

            // 视差滚动效果
            window.addEventListener('scroll', () => {
                const currentScrollY = window.scrollY;
                const delta = (currentScrollY - lastScrollY) * 0.5;

                const currentTransform = getComputedStyle(background).transform;
                const matrix = new DOMMatrix(currentTransform);
                const currentX = matrix.m41;

                background.style.transform = `translateX(${currentX - delta}px) translateY(5%)`;
                lastScrollY = currentScrollY;
            });

            // 鼠标移动效果
            document.addEventListener('mousemove', (e) => {
                const mouseX = e.clientX / window.innerWidth - 0.5;
                const mouseY = e.clientY / window.innerHeight - 0.5;

                background.style.transform = `translateX(-15%) translateY(-1%) scale(1.1)
                    translate(${mouseX * 20}px, ${mouseY * 20}px)`;
            });

            // 按钮和标题故障效果
            const buttons = document.querySelectorAll('.nav-button');
            const glitchElements = [...buttons, title];

            glitchElements.forEach(element => {
                element.addEventListener('mouseover', () => {
                    element.style.textShadow = `
                        2px 2px #ff0000,
                        -2px -2px #0000ff
                    `;
                });

                element.addEventListener('mouseout', () => {
                    element.style.textShadow = element === title ? '0 0 10px #0ff' : 'none';
                });
            });
        });
    </script>
</body>
</html>
