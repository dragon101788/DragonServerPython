<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胡鑫培的个人博客</title>
    <style>
        /* ... existing code ... */

        .hero-section {
            height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)),
                    url('/static/IMG_1612.JPG') 120% 0%/120%;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }

        .hero-content {
            max-width: 800px;
            padding: 20px;
        }

        .hero-title {
            font-size: 4rem;
            margin-bottom: 1rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .hero-subtitle {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .scroll-down {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
            cursor: pointer;
            color: white;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-30px);
            }
            60% {
                transform: translateY(-15px);
            }
        }

        .nav-button {
            background: transparent;
            border: 2px solid #3498db;
            color: #3498db;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav-button:hover {
            background: #3498db;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .profile-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem;
            margin: 3rem auto;
            max-width: 1000px;
        }

        .skills {
            margin-top: 2rem;
        }

        .skill-tag {
            background: #3498db;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 500;
            transition: transform 0.3s ease;
        }

        .skill-tag:hover {
            transform: translateY(-2px);
        }

        /* 添加暗色主题支持 */
        @media (prefers-color-scheme: dark) {
            body {
                background: #1a1a1a;
                color: #ffffff;
            }

            .profile-section {
                background: rgba(30, 30, 30, 0.95);
            }

            .skill-tag {
                background: #2980b9;
            }
        }
    </style>
</head>
<body>
    <section class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">胡鑫培</h1>
            <p class="hero-subtitle">程序员 / 硬件工程师 / AI工程师 / 健身达人</p>
            <div class="nav-buttons">
                <a href="#" class="nav-button" onclick="navigate('projects')">项目展示</a>
                <a href="#" class="nav-button" onclick="navigate('blog')">技术博客</a>
                <a href="#" class="nav-button" onclick="navigate('contact')">联系我</a>
                <a href="#" class="nav-button" onclick="navigate('resume')">简历</a>
            </div>
        </div>
        <div class="scroll-down">
            ↓
        </div>
    </section>

    <div class="container">
        <section class="profile-section">
            <h2>关于我</h2>
            <p>你好！我是胡鑫培，一名充满激情的全栈开发工程师。我专注于AI开发和硬件工程，同时也是一名健身爱好者。</p>

            <h3>专业技能</h3>
            <div class="skills">
                <span class="skill-tag">Python</span>
                <span class="skill-tag">JavaScript</span>
                <span class="skill-tag">硬件设计</span>
                <span class="skill-tag">机器学习</span>
                <span class="skill-tag">深度学习</span>
                <span class="skill-tag">Web开发</span>
            </div>
        </section>
    </div>

    <script>
        // 平滑滚动效果
        document.querySelector('.scroll-down').addEventListener('click', () => {
            window.scrollTo({
                top: window.innerHeight,
                behavior: 'smooth'
            });
        });

        // 导航功能
        function navigate(section) {
            const routes = {
                'projects': '/projects',
                'blog': '/blog',
                'contact': '/contact',
                'resume': '/resume'
            };

            alert(`即将跳转到${routes[section]}页面`);
            // 实际项目中，这里可以替换为真实的页面跳转逻辑
            // window.location.href = routes[section];
        }

        // 添加滚动动画
        window.addEventListener('scroll', () => {
            const sections = document.querySelectorAll('.profile-section');
            sections.forEach(section => {
                const rect = section.getBoundingClientRect();
                if (rect.top < window.innerHeight && rect.bottom >= 0) {
                    section.style.opacity = '1';
                    section.style.transform = 'translateY(0)';
                }
            });
        });
    </script>
</body>
</html>
