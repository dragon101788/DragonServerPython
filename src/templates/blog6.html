<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人主页博客</title>
  <style>
    /* 整体页面样式 */
    body {
      margin: 0;
      padding: 0;
      background-image: url('/static/IMG_1612.JPG');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: Arial, sans-serif;
      color: white;
    }

    /* 按钮简介栏容器 */
   .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* 超链接按钮样式 */
   .button {
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      padding: 15px 30px;
      margin: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
    }

   .button:hover {
      background-color: rgba(0, 0, 0, 0.8);
    }

    /* 简介文本样式 */
   .description {
      text-align: center;
      max-width: 600px;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- 4个超链接按钮 -->
    <a href="#" class="button">博客文章</a>
    <a href="#" class="button">关于我</a>
    <a href="#" class="button">作品展示</a>
    <a href="#" class="button">联系我</a>
    <!-- 简介文本 -->
    <p class="description">
      欢迎来到我的个人主页，这里是我分享生活、想法以及经验的小天地。
      我热衷于探索各种有趣的事物，希望通过这个博客与大家交流互动。
      一起开启这段精彩的旅程吧！
    </p>
  </div>

  <script>
    // 这里可以添加更多JavaScript代码来实现页面动态效果，比如以下是简单的滚轮滚动改变背景透明度示例
    window.addEventListener('scroll', function () {
      const body = document.body;
      const scrollPosition = window.scrollY;
      const maxScroll = document.body.scrollHeight - window.innerHeight;
      const opacity = scrollPosition / maxScroll;
      body.style.backgroundColor = `rgba(0, 0, 0, ${opacity})`;
    });
  </script>
</body>

</html>
