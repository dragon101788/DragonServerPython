<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>高级留言板 - 专属胡鑫培大神</title>
    <!-- 引入 UI 库 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #1a1a1a;
            color: #fff;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            padding: 20px;
        }

        .board-title {
            text-align: center;
            background: linear-gradient(45deg, #11998e, #38ef7d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
            margin: 30px 0;
            font-weight: bold;
        }

        .message-card {
            background: #2d2d2d;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border-left: 5px solid #38ef7d;
            transition: transform 0.3s ease;
        }

        .message-card:hover {
            transform: translateX(5px);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #38ef7d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a1a;
            font-weight: bold;
        }

        .message-time {
            color: #888;
            font-size: 0.9rem;
        }

        .message-content {
            color: #ddd;
            line-height: 1.6;
            font-size: 1.1rem;
        }

        .message-form {
            background: #2d2d2d;
            padding: 25px;
            border-radius: 15px;
            margin-top: 40px;
            margin-bottom: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .form-control {
            background: #333;
            border: 1px solid #444;
            color: #fff;
            margin-bottom: 15px;
        }

        .form-control:focus {
            background: #404040;
            border-color: #38ef7d;
            color: #fff;
            box-shadow: 0 0 0 0.2rem rgba(56, 239, 125, 0.25);
        }

        .btn-submit {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            border: none;
            padding: 10px 30px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(56, 239, 125, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="board-title animate__animated animate__fadeInDown">胡鑫培大神的留言板</h1>

        <div id="message-list"></div>

        <div class="message-form animate__animated animate__fadeInUp">
            <div class="row">
                <div class="col-md-3">
                    <input type="text" id="name" class="form-control" placeholder="您的大名">
                </div>
                <div class="col-md-9">
                    <textarea id="content" class="form-control" rows="3" placeholder="请输入留言内容"></textarea>
                    <button onclick="addMessage()" class="btn btn-submit float-end">
                        <i class="fas fa-paper-plane me-2"></i>发送留言
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 引入必要的JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        let messages = [];

        function addMessage() {
            const name = document.getElementById('name').value;
            const content = document.getElementById('content').value;

            if(!name || !content) {
                Swal.fire({
                    icon: 'error',
                    title: '出错啦！',
                    text: '请填写完整信息！',
                    background: '#2d2d2d',
                    color: '#fff'
                });
                return;
            }

            const message = {
                name: name,
                content: content,
                time: new Date().toLocaleString()
            };

            messages.unshift(message);
            renderMessages();
            clearForm();

            Swal.fire({
                icon: 'success',
                title: '发送成功！',
                showConfirmButton: false,
                timer: 1500,
                background: '#2d2d2d',
                color: '#fff'
            });
        }

        function renderMessages() {
            const messageList = document.getElementById('message-list');
            messageList.innerHTML = messages.map(msg => `
                <div class="message-card animate__animated animate__fadeIn">
                    <div class="message-header">
                        <div class="user-info">
                            <div class="avatar">${msg.name[0]}</div>
                            <div class="user-name">${msg.name}</div>
                        </div>
                        <div class="message-time">
                            <i class="far fa-clock me-1"></i>${msg.time}
                        </div>
                    </div>
                    <div class="message-content">${msg.content}</div>
                </div>
            `).join('');
        }

        function clearForm() {
            document.getElementById('content').value = '';
        }
    </script>
</body>
</html>
