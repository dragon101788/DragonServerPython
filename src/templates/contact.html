                        height: auto;

                        padding-left: 20px;
                        margin-left: 0;
                        color: #666;
                    }
                    pre {
                        background-color: #f5f5f5;
                        padding: 15px;
                        border-radius: 4px;
                        overflow-x: auto;
                        font-family: 'Courier New', Courier, monospace;
                    }
                </style>
