<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Personal Blog</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        .hero {
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('/static/IMG_1612.JPG') center/cover;
            filter: brightness(0.6);
            transform: scale(1.1);
        }

        .hero-content {
            position: relative;
            z-index: 1;
            padding: 2rem;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .nav-buttons {
            display: flex;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .nav-button {
            padding: 1rem 2rem;
            text-decoration: none;
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #0ff;
            border-radius: 5px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .nav-button:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 20px #0ff;
        }

        .nav-button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(0, 255, 255, 0.3), transparent);
            transform: rotate(45deg);
            animation: glitch 2s linear infinite;
        }

        .bio {
            max-width: 600px;
            text-align: center;
            line-height: 1.6;
            font-size: 1.2rem;
            background: rgba(0, 0, 0, 0.7);
            padding: 2rem;
            border-left: 4px solid #0ff;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glitch {
            0% {
                transform: translateX(-100%) rotate(45deg);
            }
            100% {
                transform: translateX(100%) rotate(45deg);
            }
        }

        @keyframes glow {
            from {
                box-shadow: 0 0 5px #0ff, 0 0 10px #0ff, 0 0 15px #0ff;
            }
            to {
                box-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 30px #0ff;
            }
        }

        .glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15) 0px,
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            animation: scan 8s linear infinite;
        }

        @keyframes scan {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(100vh);
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="hero-bg"></div>
        <div class="hero-content">
            <nav class="nav-buttons">
                <a href="#about" class="nav-button">About</a>
                <a href="#projects" class="nav-button">Projects</a>
                <a href="#blog" class="nav-button">Blog</a>
                <a href="#contact" class="nav-button">Contact</a>
            </nav>
            <div class="bio">
                I'm a passionate developer and tech enthusiast exploring the frontiers of technology.
                With expertise in full-stack development and AI, I create innovative solutions that
                push the boundaries of what's possible in the digital realm.
            </div>
        </div>
    </div>
    <div class="glitch-overlay"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hero = document.querySelector('.hero-bg');
            const content = document.querySelector('.hero-content');

            window.addEventListener('scroll', () => {
                const scrolled = window.pageYOffset;
                hero.style.transform = `scale(${1 + scrolled * 0.0005})`;
                content.style.transform = `translateY(${scrolled * 0.5}px)`;
            });

            // 添加鼠标移动视差效果
            document.addEventListener('mousemove', (e) => {
                const mouseX = e.clientX / window.innerWidth - 0.5;
                const mouseY = e.clientY / window.innerHeight - 0.5;

                hero.style.transform = `scale(1.1) translate(${mouseX * 20}px, ${mouseY * 20}px)`;
                content.style.transform = `translate(${mouseX * 40}px, ${mouseY * 40}px)`;
            });

            // 添加平滑滚动效果
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    document.querySelector(this.getAttribute('href')).scrollIntoView({
                        behavior: 'smooth'
                    });
                });
            });
        });
    </script>
</body>
</html>
