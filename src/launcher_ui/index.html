<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DragonServer 启动器管理界面</title>
    <!-- 添加Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 头部样式 */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .header h1 i {
            margin-right: 15px;
            color: #3498db;
        }
        
        .header p {
            color: #7f8c8d;
            font-size: 1.1rem;
        }
        
        /* 状态卡片样式 */
        .status-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .status-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .status-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }
        
        .status-card i {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #3498db;
        }
        
        .status-card h3 {
            font-size: 1.2rem;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .status-card .value {
            font-size: 2rem;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .status-card.running .value {
            color: #27ae60;
        }
        
        /* 控制按钮样式 */
        .control-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: center;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 150px;
        }
        
        .btn i {
            margin-right: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #2980b9, #1f6da8);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }
        
        .btn-danger:hover {
            background: linear-gradient(135deg, #c0392b, #a93226);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
        }
        
        .btn-warning:hover {
            background: linear-gradient(135deg, #e67e22, #d35400);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.4);
        }
        
        /* 程序列表样式 */
        .programs-table {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }
        
        .programs-table h2 {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        
        .programs-table h2 i {
            margin-right: 10px;
            color: #3498db;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ecf0f1;
        }
        
        th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: #2c3e50;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        tr:hover {
            background-color: #f8f9fa;
        }
        
        /* 状态指示器 */
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-indicator.running {
            background-color: #27ae60;
        }
        
        .status-indicator.stopped {
            background-color: #7f8c8d;
        }
        
        /* 程序操作按钮 */
        .program-actions {
            display: flex;
            gap: 10px;
        }
        
        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }
        
        .action-btn i {
            margin-right: 5px;
        }
        
        .start-btn {
            background-color: #27ae60;
            color: white;
        }
        
        .start-btn:hover {
            background-color: #229954;
        }
        
        .stop-btn {
            background-color: #e74c3c;
            color: white;
        }
        
        .stop-btn:hover {
            background-color: #c0392b;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .control-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
            }
            
            table {
                font-size: 0.9rem;
            }
            
            th, td {
                padding: 10px;
            }
            
            .program-actions {
                flex-direction: column;
            }
        }
        
        /* 加载动画 */
        .loading {
            display: none;
            text-align: center;
            padding: 50px;
            color: #7f8c8d;
        }
        
        .loading.active {
            display: block;
        }
        
        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #3498db;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 消息提示样式 */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }
        
        .toast.active {
            transform: translateX(0);
        }
        
        .toast.success {
            background-color: #27ae60;
        }
        
        .toast.error {
            background-color: #e74c3c;
        }
        
        .toast.info {
            background-color: #3498db;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1><i class="fas fa-server"></i> DragonServer 启动器管理界面</h1>
            <p>通过浏览器远程管理您的服务器和应用程序</p>
        </header>
        
        <!-- 状态卡片 -->
        <div class="status-cards">
            <div class="status-card">
                <i class="fas fa-list"></i>
                <h3>总程序数</h3>
                <div class="value" id="total-programs">--</div>
            </div>
            <div class="status-card running">
                <i class="fas fa-play-circle"></i>
                <h3>运行中</h3>
                <div class="value" id="running-programs">--</div>
            </div>
            <div class="status-card">
                <i class="fas fa-desktop"></i>
                <h3>启动器状态</h3>
                <div class="value" id="launcher-status">--</div>
            </div>
        </div>
        
        <!-- 控制按钮 -->
        <div class="control-buttons">
            <button class="btn btn-primary" id="start-all-btn">
                <i class="fas fa-play"></i> 启动所有程序
            </button>
            <button class="btn btn-danger" id="stop-all-btn">
                <i class="fas fa-stop"></i> 停止所有程序
            </button>
            <button class="btn btn-warning" id="refresh-btn">
                <i class="fas fa-sync-alt"></i> 刷新状态
            </button>
        </div>
        
        <!-- 程序列表 -->
        <div class="programs-table">
            <h2><i class="fas fa-tasks"></i> 程序管理</h2>
            
            <div class="loading active" id="loading">
                <div class="loading-spinner"></div>
                <p>正在加载程序列表...</p>
            </div>
            
            <table id="programs-table">
                <thead>
                    <tr>
                        <th>名称</th>
                        <th>路径</th>
                        <th>参数</th>
                        <th>工作目录</th>
                        <th>开机启动</th>
                        <th>管理员权限</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="programs-body">
                    <!-- 程序列表将通过JavaScript动态生成 -->
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- 消息提示 -->
    <div class="toast" id="toast"></div>
    
    <script>
        // API基础URL
        const API_BASE_URL = 'http://localhost:8804';
        
        // DOM元素
        const programsTableBody = document.getElementById('programs-body');
        const loadingElement = document.getElementById('loading');
        const totalProgramsElement = document.getElementById('total-programs');
        const runningProgramsElement = document.getElementById('running-programs');
        const launcherStatusElement = document.getElementById('launcher-status');
        const toastElement = document.getElementById('toast');
        
        // 按钮
        const startAllBtn = document.getElementById('start-all-btn');
        const stopAllBtn = document.getElementById('stop-all-btn');
        const refreshBtn = document.getElementById('refresh-btn');
        
        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            // 加载数据
            await loadAllData();
            
            // 绑定事件监听
            bindEventListeners();
            
            // 设置定时刷新（每30秒）
            setInterval(loadAllData, 30000);
        });
        
        // 绑定事件监听
        function bindEventListeners() {
            startAllBtn.addEventListener('click', startAllPrograms);
            stopAllBtn.addEventListener('click', stopAllPrograms);
            refreshBtn.addEventListener('click', loadAllData);
        }
        
        // 加载所有数据
        async function loadAllData() {
            try {
                showLoading();
                
                // 并行加载状态和程序列表
                const [statusData, programsData] = await Promise.all([
                    fetchStatus(),
                    fetchPrograms()
                ]);
                
                // 更新状态信息
                updateStatusDisplay(statusData);
                
                // 更新程序列表
                updateProgramsTable(programsData);
            } catch (error) {
                showToast('加载数据失败: ' + error.message, 'error');
                console.error('加载数据失败:', error);
            } finally {
                hideLoading();
            }
        }
        
        // 获取启动器状态
        async function fetchStatus() {
            const response = await fetch(`${API_BASE_URL}/api/status`);
            if (!response.ok) {
                throw new Error('获取状态失败');
            }
            return await response.json();
        }
        
        // 获取程序列表
        async function fetchPrograms() {
            const response = await fetch(`${API_BASE_URL}/api/programs`);
            if (!response.ok) {
                throw new Error('获取程序列表失败');
            }
            const data = await response.json();
            return data.programs || [];
        }
        
        // 更新状态显示
        function updateStatusDisplay(statusData) {
            totalProgramsElement.textContent = statusData.total_programs || 0;
            runningProgramsElement.textContent = statusData.running_programs || 0;
            launcherStatusElement.textContent = statusData.launcher_running ? '运行中' : '已停止';
            
            // 设置状态颜色
            launcherStatusElement.style.color = statusData.launcher_running ? '#27ae60' : '#e74c3c';
        }
        
        // 更新程序列表表格
        function updateProgramsTable(programs) {
            // 清空表格
            programsTableBody.innerHTML = '';
            
            // 如果没有程序
            if (programs.length === 0) {
                const emptyRow = document.createElement('tr');
                emptyRow.innerHTML = `
                    <td colspan="8" style="text-align: center; padding: 30px; color: #7f8c8d;">
                        暂无程序
                    </td>
                `;
                programsTableBody.appendChild(emptyRow);
                return;
            }
            
            // 添加程序行
            programs.forEach((program, index) => {
                const row = document.createElement('tr');
                
                // 截断长文本
                const truncateText = (text, maxLength = 50) => {
                    return text.length > maxLength ? text.substring(0, maxLength) + '...' : text;
                };
                
                row.innerHTML = `
                    <td title="${program.name}">${truncateText(program.name)}</td>
                    <td title="${program.path}">${truncateText(program.path)}</td>
                    <td title="${program.args || '无'}">${program.args ? truncateText(program.args) : '无'}</td>
                    <td title="${program.cwd}">${truncateText(program.cwd)}</td>
                    <td>${program.startup_with_windows ? '<i class="fas fa-check" style="color: #27ae60;"></i>' : '<i class="fas fa-times" style="color: #e74c3c;"></i>'}</td>
                    <td>${program.try_admin ? '<i class="fas fa-check" style="color: #27ae60;"></i>' : '<i class="fas fa-times" style="color: #e74c3c;"></i>'}</td>
                    <td>
                        <span class="status-indicator ${program.running ? 'running' : 'stopped'}"></span>
                        ${program.running ? '运行中' : '已停止'}
                    </td>
                    <td>
                        <div class="program-actions">
                            <button class="action-btn start-btn" data-index="${index}" ${program.running ? 'disabled' : ''}>
                                <i class="fas fa-play"></i> 启动
                            </button>
                            <button class="action-btn stop-btn" data-index="${index}" ${!program.running ? 'disabled' : ''}>
                                <i class="fas fa-stop"></i> 停止
                            </button>
                        </div>
                    </td>
                `;
                
                programsTableBody.appendChild(row);
            });
            
            // 绑定行内按钮事件
            document.querySelectorAll('.action-btn.start-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const index = parseInt(btn.getAttribute('data-index'));
                    await startProgram(index);
                });
            });
            
            document.querySelectorAll('.action-btn.stop-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const index = parseInt(btn.getAttribute('data-index'));
                    await stopProgram(index);
                });
            });
        }
        
        // 启动指定程序
        async function startProgram(index) {
            try {
                showLoading();
                
                const response = await fetch(`${API_BASE_URL}/api/programs/${index}/start`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast(data.message, 'success');
                    // 延迟刷新以确保程序启动
                    setTimeout(loadAllData, 1000);
                } else {
                    showToast(data.message || '启动程序失败', 'error');
                }
            } catch (error) {
                showToast('启动程序失败: ' + error.message, 'error');
                console.error('启动程序失败:', error);
            } finally {
                hideLoading();
            }
        }
        
        // 停止指定程序
        async function stopProgram(index) {
            try {
                showLoading();
                
                const response = await fetch(`${API_BASE_URL}/api/programs/${index}/stop`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast(data.message, 'success');
                    // 延迟刷新以确保程序停止
                    setTimeout(loadAllData, 1000);
                } else {
                    showToast(data.message || '停止程序失败', 'error');
                }
            } catch (error) {
                showToast('停止程序失败: ' + error.message, 'error');
                console.error('停止程序失败:', error);
            } finally {
                hideLoading();
            }
        }
        
        // 启动所有程序
        async function startAllPrograms() {
            try {
                showLoading();
                
                const response = await fetch(`${API_BASE_URL}/api/programs/start_all`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast(data.message, 'success');
                    // 延迟刷新以确保程序启动
                    setTimeout(loadAllData, 1500);
                } else {
                    showToast(data.message || '启动所有程序失败', 'error');
                }
            } catch (error) {
                showToast('启动所有程序失败: ' + error.message, 'error');
                console.error('启动所有程序失败:', error);
            } finally {
                hideLoading();
            }
        }
        
        // 停止所有程序
        async function stopAllPrograms() {
            try {
                showLoading();
                
                const response = await fetch(`${API_BASE_URL}/api/programs/stop_all`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast(data.message, 'success');
                    // 延迟刷新以确保程序停止
                    setTimeout(loadAllData, 1500);
                } else {
                    showToast(data.message || '停止所有程序失败', 'error');
                }
            } catch (error) {
                showToast('停止所有程序失败: ' + error.message, 'error');
                console.error('停止所有程序失败:', error);
            } finally {
                hideLoading();
            }
        }
        
        // 显示加载状态
        function showLoading() {
            loadingElement.classList.add('active');
        }
        
        // 隐藏加载状态
        function hideLoading() {
            loadingElement.classList.remove('active');
        }
        
        // 显示提示消息
        function showToast(message, type = 'info') {
            toastElement.textContent = message;
            toastElement.className = 'toast ' + type;
            
            // 显示提示
            setTimeout(() => {
                toastElement.classList.add('active');
            }, 10);
            
            // 3秒后隐藏
            setTimeout(() => {
                toastElement.classList.remove('active');
            }, 3000);
        }
    </script>
</body>
</html>
