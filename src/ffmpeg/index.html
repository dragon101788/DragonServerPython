<style>
    :host {
        display: block;
        width: 100%;
        height: 100%;
    }
</style>
<script type="module">
    import {FFmpegListComponent} from "./ffmpeg_list.js";
    import { FFmpeg } from "./FFmpeg.js";

    document.body.innerHTML = `
        <div id="currentFile"></div>
        <ffmpeg-list></ffmpeg-list>
    `;
    
    

    const ffmpegList = document.querySelector("ffmpeg-list");
    const currentFile = document.getElementById("currentFile");
    
    
    window.addEventListener("message", (event) => {
        console.log(event.data);
        if (event.data.action === "currentFile") {
            currentFile.innerHTML = `
                <div class="form-group">
                    <label for="inputFile">当前选择文件:</label>
                    <span id="inputFileSpan">${event.data.path}</span>
                    <button id="transcodeBtn" class="transcode-btn">开始转码</button>
                </div>
            `
            const transcodeBtn = document.getElementById("transcodeBtn");
            transcodeBtn.addEventListener("click", async () => {
                await FFmpeg.transcodeFile(event.data.path);
            });
        }
    });
    
</script>
