        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;

        /* 播放器样式 */
        #video-player {
            width: 100%;
            height: 100%;
        }
        

    </style>

<body>
    
    <script type="module">
        import { AccountManager } from '/AccountManager.js';
        import { DVideo } from '/media/dvideo.js';

        AccountManager.init();
        
        let player = undefined;
        let videoSource = null;
        
        // 初始化函数
        async function init() {
            // 检查URL参数
            const searchParams = new URLSearchParams(window.location.search);
            const src = searchParams.get('src');
            
            document.body.innerHTML = /*html*/`
                <d-video id="video-player" preload="auto" src="${src}" type="video/mp4"></d-video>
            `;
        }
        
        
        
        init();
    </script>
