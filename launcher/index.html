<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DragonServer 启动器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#6B7280',
                        success: '#00B42A',
                        warning: '#FF7D00',
                        danger: '#F53F3F',
                        info: '#86909C',
                        dark: '#1D2129',
                        light: '#F2F3F5'
                    },
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                    },
                },
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .scrollbar-thin {
                scrollbar-width: thin;
            }
            .scrollbar-none {
                scrollbar-width: none;
                -ms-overflow-style: none;
            }
            .scrollbar-none::-webkit-scrollbar {
                display: none;
            }
            .program-item-active {
                @apply bg-primary/10 border-l-4 border-primary text-primary;
            }
        }
    </style>
</head>
<body class="bg-gray-50 font-inter h-screen flex flex-col overflow-hidden">
    <header class="bg-white border-b border-gray-200 py-3 px-4 flex items-center justify-between">
        <div class="flex items-center">
            <i class="fa fa-rocket text-primary text-2xl mr-3"></i>
            <h1 class="text-xl font-bold text-gray-800">DragonServer 启动器</h1>
        </div>
        <div class="flex items-center space-x-3">
            <button id="refresh-btn" class="p-2 rounded-md hover:bg-gray-100 text-gray-600 transition-colors">
                <i class="fa fa-refresh"></i>
            </button>
            <button id="add-program-btn" class="bg-primary hover:bg-primary/90 text-white px-4 py-1.5 rounded-md transition-colors">
                <i class="fa fa-plus mr-1"></i> 添加程序
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- 左侧程序列表 -->
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col">
            <div class="p-3 border-b border-gray-200">
                <div class="relative">
                    <input type="text" id="search-input" placeholder="搜索程序..." 
                        class="w-full pl-9 pr-3 py-1.5 rounded-md border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary text-sm">
                    <i class="fa fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto scrollbar-thin p-2" id="program-list">
                <!-- 程序列表将通过JavaScript动态加载 -->
                <div class="text-center py-8 text-gray-500">
                    <i class="fa fa-spinner fa-spin text-2xl mb-2"></i>
                    <p>加载程序列表中...</p>
                </div>
            </div>
        </aside>

        <!-- 右侧主区域 -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- 右上程序属性 -->
            <div id="program-details" class="bg-white border-b border-gray-200 p-6 flex-1 overflow-y-auto">
                <div class="text-center py-16 text-gray-500">
                    <i class="fa fa-cube text-3xl mb-3"></i>
                    <p class="text-lg">请从左侧选择一个程序</p>
                </div>
            </div>

            <!-- 右下日志窗口 -->
            <div class="h-64 bg-gray-800 text-white border-t border-gray-700 flex flex-col">
                <div class="p-2 border-b border-gray-700 flex justify-between items-center">
                    <h3 class="font-medium text-sm"><i class="fa fa-terminal mr-2"></i> 日志窗口</h3>
                    <div class="flex space-x-2">
                        <button id="clear-log-btn" class="text-xs text-gray-400 hover:text-white p-1 rounded">
                            <i class="fa fa-trash-o"></i>
                        </button>
                        <button id="autoscroll-toggle" class="text-xs text-gray-400 hover:text-white p-1 rounded active">
                            <i class="fa fa-arrow-down"></i>
                        </button>
                    </div>
                </div>
                <div class="flex-1 overflow-y-auto p-3 text-sm font-mono" id="log-window">
                    <div class="text-gray-500 italic">正在连接日志流...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- 添加/编辑程序模态框 -->
    <div id="program-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
            <div class="p-5 border-b border-gray-200 flex justify-between items-center">
                <h3 id="modal-title" class="text-lg font-bold text-gray-800">添加程序</h3>
                <button id="close-modal" class="text-gray-500 hover:text-gray-700">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <form id="program-form" class="p-5 space-y-4">
                <div>
                    <label for="program-name" class="block text-sm font-medium text-gray-700 mb-1">程序名称</label>
                    <input type="text" id="program-name" name="name" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
                </div>
                <div>
                    <label for="program-path" class="block text-sm font-medium text-gray-700 mb-1">程序路径</label>
                    <div class="flex space-x-2">
                        <input type="text" id="program-path" name="path" required
                            class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
                        <button type="button" id="browse-btn" class="px-3 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-md transition-colors">
                            <i class="fa fa-folder-open"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label for="program-args" class="block text-sm font-medium text-gray-700 mb-1">命令行参数</label>
                    <input type="text" id="program-args" name="args"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
                </div>
                <div>
                    <label for="program-cwd" class="block text-sm font-medium text-gray-700 mb-1">工作目录</label>
                    <div class="flex space-x-2">
                        <input type="text" id="program-cwd" name="cwd"
                            class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary">
                        <button type="button" id="browse-cwd-btn" class="px-3 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-md transition-colors">
                            <i class="fa fa-folder"></i>
                        </button>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="flex items-center">
                        <input type="checkbox" id="program-startup" name="startup_with_windows" class="h-4 w-4 text-primary border-gray-300 rounded">
                        <span class="ml-2 block text-sm text-gray-700">开机启动</span>
                    </label>
                    <label class="flex items-center">
                        <input type="checkbox" id="program-admin" name="try_admin" class="h-4 w-4 text-primary border-gray-300 rounded">
                        <span class="ml-2 block text-sm text-gray-700">以管理员权限运行</span>
                    </label>
                </div>
            </form>
            <div class="p-5 border-t border-gray-200 flex justify-end space-x-3">
                <button id="delete-program-btn" class="hidden px-4 py-2 bg-danger/10 text-danger hover:bg-danger/20 rounded-md transition-colors">
                    <i class="fa fa-trash mr-1"></i> 删除
                </button>
                <button id="cancel-modal" class="px-4 py-2 bg-gray-100 text-gray-700 hover:bg-gray-200 rounded-md transition-colors">
                    取消
                </button>
                <button id="save-program-btn" class="px-4 py-2 bg-primary text-white hover:bg-primary/90 rounded-md transition-colors">
                    保存
                </button>
            </div>
        </div>
    </div>

    <script>
        // 当前选中的程序
        let selectedProgram = null;
        // 是否自动滚动日志
        let autoscrollLog = true;
        // WebSocket连接
        let ws = null;
        // 是否正在编辑程序
        let isEditing = false;
        
        // 初始化函数
        function init() {
            // 加载程序列表
            loadPrograms();
            // 初始化WebSocket连接
            initWebSocket();
            // 绑定事件监听器
            bindEventListeners();
        }
        
        // 加载程序列表
        async function loadPrograms() {
            try {
                const response = await fetch('/api/programs');
                if (!response.ok) throw new Error('获取程序列表失败');
                const programs = await response.json();
                renderProgramList(programs);
                // 如果之前有选中的程序，重新选中它
                if (selectedProgram) {
                    const program = programs.find(p => p.name === selectedProgram.name);
                    if (program) {
                        selectedProgram = program;
                        renderProgramDetails(program);
                    }
                }
            } catch (error) {
                console.error('加载程序列表出错:', error);
                logMessage(`错误: 加载程序列表失败 - ${error.message}`);
                // 显示错误提示
                document.getElementById('program-list').innerHTML = `
                    <div class="text-center py-8 text-danger">
                        <i class="fa fa-exclamation-circle text-2xl mb-2"></i>
                        <p>加载失败，请刷新页面重试</p>
                    </div>
                `;
            }
        }
        
        // 渲染程序列表
        function renderProgramList(programs) {
            const programList = document.getElementById('program-list');
            
            if (programs.length === 0) {
                programList.innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <i class="fa fa-inbox text-2xl mb-2"></i>
                        <p>暂无程序，请点击添加按钮</p>
                    </div>
                `;
                return;
            }
            
            // 按名称排序
            programs.sort((a, b) => a.name.localeCompare(b.name));
            
            // 渲染程序列表
            programList.innerHTML = programs.map(program => {
                const isActive = selectedProgram && selectedProgram.name === program.name;
                const runningClass = program.running ? 'text-success' : 'text-gray-500';
                const runningIcon = program.running ? 'fa-play-circle' : 'fa-circle-o';
                
                return `
                    <div class="program-item ${isActive ? 'program-item-active' : 'hover:bg-gray-100'} rounded-md p-3 mb-1 cursor-pointer transition-colors flex items-center justify-between"
                         data-name="${program.name}">
                        <div class="flex items-center">
                            <i class="fa ${runningIcon} mr-2 ${runningClass}"></i>
                            <span class="text-sm font-medium truncate max-w-[150px]">${program.name}</span>
                        </div>
                        <div class="opacity-0 group-hover:opacity-100 transition-opacity flex space-x-1">
                            <button class="text-xs p-1 hover:bg-gray-200 rounded ${isActive ? 'text-primary' : 'text-gray-500'} start-program-btn"
                                    title="启动程序">
                                <i class="fa fa-play"></i>
                            </button>
                            <button class="text-xs p-1 hover:bg-gray-200 rounded ${isActive ? 'text-primary' : 'text-gray-500'} stop-program-btn"
                                    title="停止程序">
                                <i class="fa fa-stop"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
            
            // 绑定程序项点击事件
            document.querySelectorAll('.program-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    // 如果点击的是按钮，不触发选中操作
                    if (e.target.closest('button')) return;
                    
                    const programName = item.getAttribute('data-name');
                    const program = programs.find(p => p.name === programName);
                    if (program) {
                        selectedProgram = program;
                        // 移除所有活动状态
                        document.querySelectorAll('.program-item').forEach(i => {
                            i.classList.remove('program-item-active');
                        });
                        // 添加当前项的活动状态
                        item.classList.add('program-item-active');
                        // 渲染程序详情
                        renderProgramDetails(program);
                    }
                });
            });
            
            // 绑定启动/停止按钮事件
            document.querySelectorAll('.start-program-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const programName = btn.closest('.program-item').getAttribute('data-name');
                    startProgram(programName);
                });
            });
            
            document.querySelectorAll('.stop-program-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const programName = btn.closest('.program-item').getAttribute('data-name');
                    stopProgram(programName);
                });
            });
        }
        
        // 渲染程序详情
        function renderProgramDetails(program) {
            const detailsContainer = document.getElementById('program-details');
            
            detailsContainer.innerHTML = `
                <div class="max-w-2xl mx-auto">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-800 mb-1">${program.name}</h2>
                            <div class="flex items-center text-sm">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${program.running ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'}">
                                    <i class="fa ${program.running ? 'fa-play-circle mr-1' : 'fa-circle-o mr-1'}"></i>
                                    ${program.running ? '运行中' : '已停止'}
                                </span>
                                ${program.startup_with_windows ? `
                                    <span class="inline-flex items-center ml-2 px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                                        <i class="fa fa-windows mr-1"></i>
                                        开机启动
                                    </span>
                                ` : ''}
                                ${program.try_admin ? `
                                    <span class="inline-flex items-center ml-2 px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800">
                                        <i class="fa fa-shield mr-1"></i>
                                        管理员权限
                                    </span>
                                ` : ''}
                            </div>
                        </div>
                        <div class="flex space-x-2">
                            <button class="edit-program-btn px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-md transition-colors text-sm">
                                <i class="fa fa-pencil mr-1"></i> 编辑
                            </button>
                            <button class="start-stop-btn px-3 py-1.5 ${program.running ? 'bg-danger hover:bg-danger/90' : 'bg-primary hover:bg-primary/90'} text-white rounded-md transition-colors text-sm">
                                <i class="fa ${program.running ? 'fa-stop mr-1' : 'fa-play mr-1'}"></i>
                                ${program.running ? '停止' : '启动'}
                            </button>
                        </div>
                    </div>
                    
                    <div class="grid gap-6">
                        <div>
                            <h3 class="text-sm font-medium text-gray-500 mb-1">程序路径</h3>
                            <p class="text-sm bg-gray-50 p-2 rounded-md font-mono break-all">${program.path}</p>
                        </div>
                        
                        ${program.args ? `
                            <div>
                                <h3 class="text-sm font-medium text-gray-500 mb-1">命令行参数</h3>
                                <p class="text-sm bg-gray-50 p-2 rounded-md font-mono break-all">${program.args}</p>
                            </div>
                        ` : ''}
                        
                        ${program.cwd ? `
                            <div>
                                <h3 class="text-sm font-medium text-gray-500 mb-1">工作目录</h3>
                                <p class="text-sm bg-gray-50 p-2 rounded-md font-mono break-all">${program.cwd}</p>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
            
            // 绑定编辑按钮事件
            document.querySelector('.edit-program-btn').addEventListener('click', () => {
                openProgramModal(program);
            });
            
            // 绑定启动/停止按钮事件
            document.querySelector('.start-stop-btn').addEventListener('click', () => {
                if (program.running) {
                    stopProgram(program.name);
                } else {
                    startProgram(program.name);
                }
            });
        }
        
        // 打开程序模态框
        function openProgramModal(program = null) {
            const modal = document.getElementById('program-modal');
            const modalTitle = document.getElementById('modal-title');
            const programForm = document.getElementById('program-form');
            const deleteBtn = document.getElementById('delete-program-btn');
            
            // 重置表单
            programForm.reset();
            
            if (program) {
                // 编辑模式
                isEditing = true;
                modalTitle.textContent = '编辑程序';
                
                // 填充表单
                document.getElementById('program-name').value = program.name;
                document.getElementById('program-path').value = program.path;
                document.getElementById('program-args').value = program.args || '';
                document.getElementById('program-cwd').value = program.cwd || '';
                document.getElementById('program-startup').checked = program.startup_with_windows;
                document.getElementById('program-admin').checked = program.try_admin;
                
                // 显示删除按钮
                deleteBtn.classList.remove('hidden');
            } else {
                // 添加模式
                isEditing = false;
                modalTitle.textContent = '添加程序';
                
                // 隐藏删除按钮
                deleteBtn.classList.add('hidden');
            }
            
            // 显示模态框
            modal.classList.remove('hidden');
        }
        
        // 关闭程序模态框
        function closeProgramModal() {
            document.getElementById('program-modal').classList.add('hidden');
        }
        
        // 保存程序
        async function saveProgram() {
            const name = document.getElementById('program-name').value.trim();
            const path = document.getElementById('program-path').value.trim();
            const args = document.getElementById('program-args').value.trim();
            const cwd = document.getElementById('program-cwd').value.trim();
            const startup_with_windows = document.getElementById('program-startup').checked;
            const try_admin = document.getElementById('program-admin').checked;
            
            // 验证输入
            if (!name) {
                alert('请输入程序名称');
                return;
            }
            if (!path) {
                alert('请输入程序路径');
                return;
            }
            
            try {
                let response;
                
                if (isEditing && selectedProgram) {
                    // 更新程序
                    const programData = {
                        name: name !== selectedProgram.name ? name : undefined,
                        path: path !== selectedProgram.path ? path : undefined,
                        args: args !== selectedProgram.args ? args : undefined,
                        cwd: cwd !== selectedProgram.cwd ? cwd : undefined,
                        startup_with_windows: startup_with_windows !== selectedProgram.startup_with_windows ? startup_with_windows : undefined,
                        try_admin: try_admin !== selectedProgram.try_admin ? try_admin : undefined
                    };
                    
                    // 过滤掉undefined值
                    const filteredData = Object.fromEntries(Object.entries(programData).filter(([_, v]) => v !== undefined));
                    
                    if (Object.keys(filteredData).length === 0) {
                        alert('没有修改任何内容');
                        return;
                    }
                    
                    response = await fetch(`/api/programs/update/${selectedProgram.name}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(filteredData)
                    });
                } else {
                    // 添加程序
                    const programData = {
                        name,
                        path,
                        args,
                        cwd,
                        startup_with_windows,
                        try_admin,
                        running: false
                    };
                    
                    response = await fetch('/api/programs/add', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(programData)
                    });
                }
                
                if (!response.ok) throw new Error('保存失败');
                
                const result = await response.json();
                logMessage(`成功: ${result.message}`);
                
                // 关闭模态框
                closeProgramModal();
                
                // 重新加载程序列表
                loadPrograms();
            } catch (error) {
                console.error('保存程序出错:', error);
                logMessage(`错误: 保存程序失败 - ${error.message}`);
                alert(`保存失败: ${error.message}`);
            }
        }
        
        // 删除程序
        async function deleteProgram() {
            if (!selectedProgram || !confirm(`确定要删除程序 "${selectedProgram.name}" 吗？`)) {
                return;
            }
            
            try {
                const response = await fetch('/api/programs/remove', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name: selectedProgram.name })
                });
                
                if (!response.ok) throw new Error('删除失败');
                
                const result = await response.json();
                logMessage(`成功: ${result.message}`);
                
                // 关闭模态框
                closeProgramModal();
                
                // 重置选中状态
                selectedProgram = null;
                
                // 清空详情区域
                document.getElementById('program-details').innerHTML = `
                    <div class="text-center py-16 text-gray-500">
                        <i class="fa fa-cube text-3xl mb-3"></i>
                        <p class="text-lg">请从左侧选择一个程序</p>
                    </div>
                `;
                
                // 重新加载程序列表
                loadPrograms();
            } catch (error) {
                console.error('删除程序出错:', error);
                logMessage(`错误: 删除程序失败 - ${error.message}`);
                alert(`删除失败: ${error.message}`);
            }
        }
        
        // 启动程序
        async function startProgram(name) {
            try {
                const response = await fetch('/api/programs/start', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name })
                });
                
                if (!response.ok) throw new Error('启动失败');
                
                const result = await response.json();
                logMessage(`成功: ${result.message}`);
                
                // 重新加载程序列表，更新状态
                setTimeout(loadPrograms, 500);
            } catch (error) {
                console.error('启动程序出错:', error);
                logMessage(`错误: 启动程序失败 - ${error.message}`);
                alert(`启动失败: ${error.message}`);
            }
        }
        
        // 停止程序
        async function stopProgram(name) {
            try {
                const response = await fetch('/api/programs/stop', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name })
                });
                
                if (!response.ok) throw new Error('停止失败');
                
                const result = await response.json();
                logMessage(`成功: ${result.message}`);
                
                // 重新加载程序列表，更新状态
                setTimeout(loadPrograms, 500);
            } catch (error) {
                console.error('停止程序出错:', error);
                logMessage(`错误: 停止程序失败 - ${error.message}`);
                alert(`停止失败: ${error.message}`);
            }
        }
        
        // 初始化WebSocket连接
        function initWebSocket() {
            try {
                // 获取当前页面的主机名和端口
                const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${wsProtocol}//${window.location.host}/ws/logs`;
                
                // 创建WebSocket连接
                ws = new WebSocket(wsUrl);
                
                // 连接打开
                ws.onopen = () => {
                    logMessage('日志连接已建立');
                };
                
                // 接收消息
                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'log' && data.message) {
                            logMessage(data.message);
                        }
                    } catch (error) {
                        console.error('解析日志消息出错:', error);
                    }
                };
                
                // 连接关闭
                ws.onclose = () => {
                    logMessage('日志连接已关闭，将在5秒后重新连接...');
                    // 5秒后重新连接
                    setTimeout(initWebSocket, 5000);
                };
                
                // 连接错误
                ws.onerror = (error) => {
                    console.error('WebSocket错误:', error);
                    logMessage(`错误: 日志连接失败 - ${error.message || '未知错误'}`);
                };
            } catch (error) {
                console.error('初始化WebSocket出错:', error);
                logMessage(`错误: 无法建立日志连接 - ${error.message}`);
                // 5秒后重新连接
                setTimeout(initWebSocket, 5000);
            }
        }
        
        // 记录日志消息
        function logMessage(message) {
            const logWindow = document.getElementById('log-window');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            
            // 添加时间戳
            logEntry.classList.add('mb-1', 'flex');
            
            // 根据消息内容添加不同的样式
            let messageClass = 'flex-1';
            if (message.includes('错误:')) {
                messageClass += ' text-danger';
            } else if (message.includes('成功:')) {
                messageClass += ' text-success';
            } else if (message.includes('警告:')) {
                messageClass += ' text-warning';
            }
            
            logEntry.innerHTML = `
                <span class="text-gray-500 mr-2">[${timestamp}]</span>
                <span class="${messageClass}">${escapeHtml(message)}</span>
            `;
            
            logWindow.appendChild(logEntry);
            
            // 自动滚动到底部
            if (autoscrollLog) {
                logWindow.scrollTop = logWindow.scrollHeight;
            }
        }
        
        // 清空日志
        function clearLog() {
            document.getElementById('log-window').innerHTML = '<div class="text-gray-500 italic">日志已清空</div>';
        }
        
        // 切换自动滚动
        function toggleAutoscroll() {
            autoscrollLog = !autoscrollLog;
            const toggleBtn = document.getElementById('autoscroll-toggle');
            
            if (autoscrollLog) {
                toggleBtn.classList.add('active', 'text-white');
                toggleBtn.classList.remove('text-gray-400');
                // 滚动到底部
                const logWindow = document.getElementById('log-window');
                logWindow.scrollTop = logWindow.scrollHeight;
            } else {
                toggleBtn.classList.remove('active', 'text-white');
                toggleBtn.classList.add('text-gray-400');
            }
        }
        
        
        // 浏览文件
        function browseFile(inputId, isDirectory = false) {
            // 创建一个临时的input元素
            const input = document.createElement('input');
            input.type = isDirectory ? 'file' : 'file';
            input.webkitdirectory = isDirectory;
            input.directory = isDirectory;
            
            // 选择文件后设置到目标输入框
            input.onchange = () => {
                if (input.files.length > 0) {
                    const file = input.files[0];
                    document.getElementById(inputId).value = file.path;
                }
            };
            
            // 触发选择文件对话框
            input.click();
        }
        
        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 绑定事件监听器
        function bindEventListeners() {
            // 刷新按钮
            document.getElementById('refresh-btn').addEventListener('click', loadPrograms);
            
            // 添加程序按钮
            document.getElementById('add-program-btn').addEventListener('click', () => openProgramModal());
            
            
            // 模态框相关事件
            document.getElementById('close-modal').addEventListener('click', closeProgramModal);
            document.getElementById('cancel-modal').addEventListener('click', closeProgramModal);
            document.getElementById('save-program-btn').addEventListener('click', saveProgram);
            document.getElementById('delete-program-btn').addEventListener('click', deleteProgram);
            
            // 浏览按钮
            document.getElementById('browse-btn').addEventListener('click', () => browseFile('program-path'));
            document.getElementById('browse-cwd-btn').addEventListener('click', () => browseFile('program-cwd', true));
            
            // 日志相关事件
            document.getElementById('clear-log-btn').addEventListener('click', clearLog);
            document.getElementById('autoscroll-toggle').addEventListener('click', toggleAutoscroll);
            
            // 点击模态框背景关闭
            document.getElementById('program-modal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('program-modal')) {
                    closeProgramModal();
                }
            });
            
            // 搜索功能
            document.getElementById('search-input').addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                document.querySelectorAll('.program-item').forEach(item => {
                    const programName = item.getAttribute('data-name').toLowerCase();
                    if (programName.includes(searchTerm)) {
                        item.style.display = 'flex';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
